// The Android Gradle Plugin builds the native code with the Android NDK.
//
// This build script checks for pre-built binaries first (downloaded by
// `dart run typst_flutter:setup`). If found, they are used directly and
// Cargokit is skipped — no Rust installation required on the build machine.
// If pre-built binaries are absent, Cargokit is used as a fallback, which
// compiles the Rust crate from source (requires Rust to be installed).

group 'com.flutter_rust_bridge.rust_lib_typst_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// ── Pre-built binary detection ────────────────────────────────────────────────
//
// The setup script places pre-built .so files at:
//   {package_root}/.typst_flutter_prebuilt/android/{ABI}/librust_lib_typst_flutter.so
//
// rootProject.projectDir is the Flutter app's android/ directory, so we
// navigate up two levels to reach the package root where pubspec.yaml lives,
// then into the prebuilt directory.

def prebuiltDir = new File(
    rootProject.projectDir.parentFile,          // Flutter app root
    ".dart_tool/pub/prebuilt/typst_flutter/android"
)

// Also try the direct path from the plugin's location (when used as a
// path dependency during development).
def pluginPrebuiltDir = new File(
    project.projectDir.parentFile.parentFile,   // rust_builder/ → package root
    ".typst_flutter_prebuilt/android"
)

def usePrebuilt = prebuiltDir.exists() || pluginPrebuiltDir.exists()
def activePrebuiltDir = prebuiltDir.exists() ? prebuiltDir : pluginPrebuiltDir

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_typst_flutter'
    }

    compileSdkVersion 34

    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    if (usePrebuilt) {
        // ── Pre-built path ────────────────────────────────────────────────────
        // Tell the Android Gradle Plugin to package the pre-built .so files
        // from the downloaded directory. No NDK compilation needed.
        sourceSets {
            main {
                jniLibs.srcDirs += [activePrebuiltDir.absolutePath]
            }
        }
    }
}

if (!usePrebuilt) {
    // ── Cargokit fallback ─────────────────────────────────────────────────────
    // Pre-built binaries not found. Fall back to building from Rust source.
    // Requires Rust + cargo to be installed on the build machine.
    logger.lifecycle("""
    ┌──────────────────────────────────────────────────────────────────┐
    │ typst_flutter: pre-built binaries not found.                     │
    │ Falling back to Cargokit (compiling from Rust source).           │
    │                                                                  │
    │ To avoid this, run once after flutter pub get:                   │
    │   dart run typst_flutter:setup                                   │
    └──────────────────────────────────────────────────────────────────┘
    """)
    apply from: "../cargokit/gradle/plugin.gradle"
    cargokit {
        manifestDir = "../../rust"
        libname = "rust_lib_typst_flutter"
    }
}
