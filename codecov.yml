# Codecov configuration for typst_flutter
# https://docs.codecov.io/docs/codecov-yaml

# coverage:
#   status:
#     project:
#       default:
#         target: auto
#         threshold: 5%
#     patch:
#       default:
#         target: 80%

# Exclude auto-generated files from coverage reporting
ignore:
  # FRB-generated Dart bridge code (auto-generated by flutter_rust_bridge)
  - "lib/src/rust/**"
  # FRB-generated Rust bridge code
  - "rust/src/frb_generated.rs"
  # Example app (not part of the package)
  - "example/**"
  # Platform-specific build glue (not testable Dart/Rust code)
  - "android/**"
  - "ios/**"
  - "linux/**"
  - "macos/**"
  - "windows/**"
  - "rust_builder/**"
  # Test files themselves (don't count test code as "covered")
  - "test/**"
  - "integration_test/**"

flags:
  dart:
    paths:
      - lib/
    carryforward: true
  rust:
    paths:
      - rust/src/
    carryforward: true
