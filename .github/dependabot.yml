version: 2
updates:
  # Dart & Flutter dependencies (Root package)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      pub-dependencies:
        patterns:
          - "*"

  # Dart & Flutter dependencies (Example application)
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      example-dependencies:
        patterns:
          - "*"

  # Dart & Flutter dependencies (rust_builder package)
  - package-ecosystem: "pub"
    directory: "/rust_builder"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      rust-builder-dependencies:
        patterns:
          - "*"

  # Rust dependencies (Cargo crate)
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      typst-crates:
        patterns:
          - "typst*"
      cargo-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
