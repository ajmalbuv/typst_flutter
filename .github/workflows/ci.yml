name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check format
        run: cargo fmt --all -- --check
        working-directory: rust
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: rust
      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: rust

  dart-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: just get
      - name: Run tests with coverage
        run: just test-coverage
      - name: Filter coverage (exclude generated code)
        run: dart run tool/filter_lcov.dart
      - name: Upload Dart Coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: dart
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - name: Run Integration Tests
        if: runner.os != 'Linux'
        run: just test-integration
      - name: Run Integration Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run just test-integration

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@just
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --ignore-filename-regex "frb_generated"
        working-directory: rust
      - name: Upload Rust Coverage
        uses: codecov/codecov-action@v7
        with:
          files: rust/lcov.info
          flags: rust

  pub-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install pana
        run: dart pub global activate pana
      - name: Analyze Package
        id: analysis
        run: |
          pana --json > pana_report.json

          # Multiline output for GitHub Actions
          echo "json_output<<EOF" >> $GITHUB_OUTPUT
          cat pana_report.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Enforce Pub Package Score
        uses: fujidaiti/dart-package-inspector@v2
        with:
          report: ${{ steps.analysis.outputs.json_output }}
          min-pub-points: 160
