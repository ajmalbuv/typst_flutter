[package]
name = "typst_flutter"
version = "1.0.0"
edition = "2024"
description = "Native Typst typesetting compiler for Flutter via Rust FFI"
license = "Apache-2.0"

[lib]
name = "typst_flutter"
crate-type = ["cdylib", "staticlib"]

[dependencies]
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-render = "0.14.2"
typst-svg = "0.14.2"
comemo = "0.5.1"
flutter_rust_bridge = "=2.12.0"
time = "0.3.47"

[profile.release]
opt-level = "z"      # optimise for binary size
lto = true           # link-time optimisation (cross-crate inlining)
codegen-units = 1    # single codegen unit for maximum optimisation
strip = true         # strip debug symbols from the output
panic = "abort"      # smaller binary: no unwinding tables
